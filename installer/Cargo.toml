[package]
name = "inkling"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Installer and launcher for Inkling 2 Mini on the quill engine (Windows + NVIDIA)"
publish = false

[[bin]]
name = "inkling"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
ureq = "3.5"
sha2 = "0.11"
sha1 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rfd = "0.18"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
